<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Loading Preview</title>
  <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }

    body.dark {
      background: linear-gradient(180deg, rgba(20,20,30,1) 0%, rgba(30,30,45,1) 100%);
      color: #e2e8f0;
    }

    body.light {
      background: linear-gradient(180deg, rgba(250,251,254,1) 0%, rgba(240,242,248,1) 100%);
      color: #1e293b;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    body.dark .theme-toggle {
      background: rgba(255,255,255,0.1);
      color: #e2e8f0;
    }

    body.light .theme-toggle {
      background: rgba(0,0,0,0.05);
      color: #1e293b;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    .loading-card {
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      transition: all 0.3s ease;
    }

    body.dark .loading-card {
      background: linear-gradient(145deg, rgba(40,42,54,0.9) 0%, rgba(30,32,44,0.95) 100%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.3);
    }

    body.light .loading-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.95) 0%, rgba(248,250,252,0.9) 100%);
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 20px 60px rgba(0,0,0,0.08), 0 8px 20px rgba(0,0,0,0.04);
    }

    .lottie-container {
      width: 280px;
      height: 200px;
      margin: 0 auto 24px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #29B6F6;
    }

    body.dark .title {
      color: #4FC3F7;
    }

    .step {
      font-size: 16px;
      margin-bottom: 24px;
      min-height: 24px;
      transition: opacity 0.3s ease;
    }

    body.dark .step {
      color: #94a3b8;
    }

    body.light .step {
      color: #64748b;
    }

    .progress-container {
      margin-bottom: 24px;
    }

    .progress-bar {
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    body.dark .progress-bar {
      background: rgba(255,255,255,0.08);
    }

    body.light .progress-bar {
      background: rgba(0,0,0,0.06);
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
      background: #29B6F6;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 12px;
    }

    body.dark .progress-text {
      color: #64748b;
    }

    body.light .progress-text {
      color: #94a3b8;
    }

    .step-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .dot.inactive {
      background: rgba(255,255,255,0.15);
    }

    body.light .dot.inactive {
      background: rgba(0,0,0,0.12);
    }

    .dot.active {
      background: #29B6F6;
      transform: scale(1.3);
    }

    .dot.completed {
      background: #29B6F6;
      opacity: 0.5;
    }

    .query-box {
      padding: 16px;
      border-radius: 8px;
      text-align: left;
    }

    body.dark .query-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
    }

    body.light .query-box {
      background: rgba(0,0,0,0.03);
      border: 1px solid rgba(0,0,0,0.05);
    }

    .query-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      margin-bottom: 4px;
    }

    body.dark .query-label {
      color: #64748b;
    }

    body.light .query-label {
      color: #94a3b8;
    }

    .query-text {
      font-size: 14px;
      font-style: italic;
    }

    body.dark .query-text {
      color: #94a3b8;
    }

    body.light .query-text {
      color: #64748b;
    }

    .tip {
      margin-top: 24px;
      font-size: 12px;
      opacity: 0.7;
    }

    body.dark .tip {
      color: #64748b;
    }

    body.light .tip {
      color: #94a3b8;
    }
  </style>
</head>

                { "i": { "x": [0.4], "y": [1] }, "o": { "x": [0.6], "y": [0] }, "t": 0, "s": [50] },
                { "i": { "x": [0.4], "y": [1] }, "o": { "x": [0.6], "y": [0] }, "t": 90, "s": [0] },
                { "t": 180, "s": [50] }
              ]
            },
            "r": { "a": 0, "k": 0 },
            "p": { "a": 0, "k": [100, 100, 0] },
            "a": { "a": 0, "k": [0, 0, 0] },
            "s": {
              "a": 1,
              "k": [
                { "i": { "x": [0.4, 0.4], "y": [1, 1] }, "o": { "x": [0.6, 0.6], "y": [0, 0] }, "t": 0, "s": [80, 80] },
                { "i": { "x": [0.4, 0.4], "y": [1, 1] }, "o": { "x": [0.6, 0.6], "y": [0, 0] }, "t": 90, "s": [150, 150] },
                { "t": 180, "s": [80, 80] }
              ]
            }
          },
          "ao": 0,
          "shapes": [
            { "ty": "el", "d": 1, "s": { "a": 0, "k": [100, 100] }, "p": { "a": 0, "k": [0, 0] } },
            {
              "ty": "st",
              "c": { "a": 0, "k": [0.23, 0.51, 0.96, 1] },
              "o": { "a": 0, "k": 100 },
              "w": { "a": 0, "k": 2 },
              "lc": 2,
              "lj": 2
            }
          ]
        }
      ],
      "markers": []
    };

    // Loading steps
    const steps = [
      { label: 'Analyzing data structure', icon: '📊' },
      { label: 'Identifying patterns', icon: '🔍' },
      { label: 'Generating visualizations', icon: '📈' },
      { label: 'Preparing insights', icon: '💡' }
    ];

    let currentStep = 0;
    let progress = 0;

    // Update step
    function updateStep() {
      document.getElementById('step-text').textContent =
        `${steps[currentStep].icon} ${steps[currentStep].label}...`;

      // Update dots
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        dot.className = 'dot';
        if (i < currentStep) {
          dot.classList.add('completed');
        } else if (i === currentStep) {
          dot.classList.add('active');
        } else {
          dot.classList.add('inactive');
        }
      }

      currentStep = (currentStep + 1) % steps.length;
    }

    // Update progress
    function updateProgress() {
      if (progress < 95) {
        progress += Math.random() * 8;
        if (progress > 95) progress = 95;
      }
      document.getElementById('progress-fill').style.width = `${progress}%`;
      document.getElementById('progress-value').textContent = Math.round(progress);
    }

    // Start intervals
    setInterval(updateStep, 2500);
    setInterval(updateProgress, 500);

    // Theme toggle
    function toggleTheme() {
      document.body.classList.toggle('dark');
      document.body.classList.toggle('light');
    }
  </script>
</body>
</html>
