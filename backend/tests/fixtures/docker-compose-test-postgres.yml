version: '3.8'

services:
  test-postgres:
    image: postgres:15-alpine
    container_name: mantrix-test-postgres
    environment:
      POSTGRES_DB: test_mantrix
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass_123
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5433:5432"  # Use 5433 to avoid conflicts
    volumes:
      - ./test_postgres_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_mantrix"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mantrix-test-network

networks:
  mantrix-test-network:
    driver: bridge
