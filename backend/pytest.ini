[pytest]
# Pytest configuration for Mantrix Axis AI

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated component tests)
    integration: Integration tests (multi-component tests)
    e2e: End-to-end tests (full workflow tests)
    slow: Slow tests (execution time > 10s)
    requires_db: Tests requiring database access
    requires_redis: Tests requiring Redis
    requires_weaviate: Tests requiring Weaviate

# Logging
log_cli = false
log_cli_level = INFO
log_file = test_results/pytest.log
log_file_level = DEBUG

# Coverage (if pytest-cov is installed)
# [tool:pytest]
# cov = src
# cov-report = html:test_results/coverage
# cov-report = term-missing

# Minimum Python version
minversion = 3.9

# Timeout for tests (requires pytest-timeout)
# timeout = 300
